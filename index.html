<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Közösségi Oldal</title>
    <!-- PWA Manifest összekötés -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <!-- PWA Funkciók -->
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js')
        .then(function() { console.log("Minisoc PWA készen áll!"); })
        .catch(function(err) { console.log("PWA regisztrációs hiba:", err); });
    });
  }
    
  document.addEventListener('DOMContentLoaded', () => {
    let elmentettPrompt;
    const pwaBanner = document.getElementById('pwa-banner');
    const pwaGomb = document.getElementById('pwa-gomb');

    if (!pwaBanner || !pwaGomb) return;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      elmentettPrompt = e;
    });

    pwaGomb.addEventListener('click', async () => {
      if (elmentettPrompt) {
        elmentettPrompt.prompt();
        const { outcome } = await elmentettPrompt.userChoice;
        console.log(`Felhasználó választása: ${outcome}`);
        elmentettPrompt = null;
        pwaBanner.style.display = 'none';
      } else {
        alert("A telepítéshez kattints a böngésző címsorában található monitor ikonra, vagy a jobb felső hárompontos menüben az 'App telepítése' opcióra!");
      }
    });

    window.addEventListener('appinstalled', () => {
      pwaBanner.style.display = 'none';
    });
  });
</script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
   <!-- Fixen látható PWA Telepítési Banner bezáró gomb nélkül -->
<div id="pwa-banner" style="position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 26, 36, 0.95); backdrop-filter: blur(10px); box-shadow: 0 -4px 20px rgba(0,0,0,0.3); z-index: 9999; padding: 12px 20px; box-sizing: border-box; font-family: sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; color: white;">
    
    <!-- Bal oldal: Ikon és Szöveg -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="icon.png" alt="Minisoc" style="width: 45px; height: 45px; border-radius: 10px; object-fit: cover; display: block;">
      <div style="text-align: left;">
        <h4 style="margin: 0; font-size: 15px; font-weight: 600; color: #fff; line-height: 1.2;">Minisoc</h4>
        <p style="margin: 2px 0 0 0; font-size: 12px; color: #a0a0b0; line-height: 1.2;">Telepítsd az appot a teljes élményért!</p>
      </div>
    </div>

    <!-- Jobb oldal: Csak a Telepítés gomb -->
    <div style="display: flex; align-items: center;">
      <button id="pwa-gomb" style="all: unset; background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
        Telepítés
      </button>
    </div>

  </div>
</div>




    <div class="container">
        <!-- Auth Szekció -->
        <div id="auth-container" class="card">
            <h2 id="auth-title">Bejelentkezés</h2>
                        <form id="auth-form">
                <input type="text" id="username" placeholder="Felhasználónév" required>
                <input type="password" id="password" placeholder="Jelszó" required>
                <!-- ÚJ MEZŐ: Ide kell majd beírni a titkos kódot -->
                <input type="text" id="school-code" placeholder="Iskolai kód (Regisztrációhoz)">
                <button type="submit" id="auth-btn">Belépés</button>
            </form>

            <p id="toggle-auth">Nincs még fiókod? <span id="toggle-link">Regisztráció</span></p>
        </div>

        <!-- Főoldal Szekció -->
        <div id="main-container" class="hidden">
            <header class="main-header">
                <h2>Üdv, <span id="user-display"></span>!</h2>
                <button id="logout-btn" class="danger-btn">Kijelentkezés</button>
            </header>

            <div class="card new-post-card">
                <textarea id="post-content" placeholder="Mi jár a fejedben?" required></textarea>
                <button id="submit-post-btn">Megosztás</button>
            </div>

            <div id="feed"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
